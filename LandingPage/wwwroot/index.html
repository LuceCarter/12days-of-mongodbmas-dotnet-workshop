<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Santa's Workshop — 12 Days of MongoDBmas (C#)</title>
    <meta name="description" content="Cocoa on Santa's four-thousand-page ledger! Rescue it in five hands-on C# challenges, from InsertOne() to an AI agent. Free MongoDB skill badges." />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:title" content="Santa's Workshop — 12 Days of MongoDBmas (C#)" />
    <meta property="og:description" content="Cocoa on Santa's four-thousand-page ledger! Rescue it in five hands-on C# challenges, from InsertOne() to an AI agent. Free MongoDB skill badges." />
    <meta property="og:type" content="website" />

    <!--
        Deployed to a GitHub Pages project subpath, so the base href must be
        "/<repo-name>/" there and "/" when running locally.
        .github/workflows/pages.yml rewrites this exact line at publish time.
        If you change it, change the sed in that workflow too.
    -->
    <base href="/" />

    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!--
        The MongoDB leaf in a Santa hat. Regenerate with favicon-src/build-favicons.py.
        Paths are relative so they resolve under <base href> on the Pages sub-path.
        favicon.ico covers older browsers (and asks for the 48px entry on a Windows shortcut);
        the PNGs are what modern browsers actually choose.
    -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong loading the page.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
